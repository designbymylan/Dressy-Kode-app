# Déploie une Edge Function Supabase depuis GitHub (24/11, demandé par l'utilisateur).
#
# Pourquoi : depuis l'environnement de Claude, la CLI Supabase est bloquée (le
# proxy remplace le jeton), et le jeton ne doit jamais passer par la conversation.
# Ici il vit dans les secrets du dépôt : Settings > Secrets and variables >
# Actions > « SUPABASE_ACCESS_TOKEN » (un jeton créé sur
# https://supabase.com/dashboard/account/tokens).
#
# Déclenchement :
#   - un push qui touche `dressy-agent` (ou `_shared`) sur `main` ou sur la
#     branche de travail ci-dessous déploie `dressy-agent` ;
#   - à la main (onglet Actions > « Déployer une fonction » > Run workflow), pour
#     n'importe quelle fonction. Le workflow doit alors être sur la branche par défaut.
#
# Retirer la branche de travail des `branches` une fois les essais finis.
name: Déployer une fonction

on:
  push:
    branches:
      - main
      - claude/adoring-gates-rvv8gm
    paths:
      - 'supabase/functions/dressy-agent/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deployer-fonction.yml'
  workflow_dispatch:
    inputs:
      fonction:
        description: 'Fonction à déployer'
        required: true
        default: dressy-agent
        type: choice
        options: [dressy-agent, kode, billing, stripe-webhook, donnees, compte, menage, notifier, banc-ia]

concurrency:
  group: deployer-${{ inputs.fonction || 'dressy-agent' }}
  cancel-in-progress: false

env:
  PROJET: pxjlbtevrexlckhxskdn
  FONCTION: ${{ inputs.fonction || 'dressy-agent' }}

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Le jeton est présent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent : l'ajouter dans Settings > Secrets and variables > Actions, puis relancer le job."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Sans vérification du JWT : fonctions appelées par la base, Stripe ou le ménage de la nuit.
          # Avec : celles que l'app appelle connectée (kode, billing, donnees, compte).
          case "$FONCTION" in
            dressy-agent|stripe-webhook|menage|notifier|banc-ia) JWT="--no-verify-jwt" ;;
            *) JWT="" ;;
          esac
          supabase functions deploy "$FONCTION" --use-api $JWT --project-ref "$PROJET"
          echo "Déployée : $FONCTION (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: La fonction répond
        if: env.FONCTION == 'dressy-agent'
        run: |
          sleep 10
          curl -fsS "https://${PROJET}.supabase.co/functions/v1/dressy-agent" | tee /dev/stderr | grep -q '"regle_arrivee"'
